[project]
name = "senwisetool-backend"
version = "0.1.0"
description = "Backend for SenWiseTool"
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.142.4,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt[crypto] (>=2.15.1,<3.0.0)",
    "pyotp (>=2.10.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "aiosmtplib (>=5.0.0,<6.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "boto3 (>=1.43.114,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
pytest-cov = "^7.1.0"

